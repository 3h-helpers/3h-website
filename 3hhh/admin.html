<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3H Admin - Lottery</title>
<style>
body{font-family:sans-serif;background:#111;color:#fff;padding:15px}
button{width:100%;padding:15px;margin:8px 0;border:0;border-radius:10px;font-size:18px;font-weight:bold}
.prize1{background:#FFD700}.prize2{background:#C0C0C0}.prize3{background:#CD7F32;color:#fff}.prize4{background:#00c853;color:#fff}
textarea{width:100%;height:120px;border-radius:8px;padding:10px}
#winners{background:#222;padding:15px;border-radius:10px;margin-top:15px}
</style>
</head>
<body>
<h2>3H Admin Panel 🎉</h2>
<p>Total Users: <b id="count">0</b></p>
<textarea id="names" placeholder="Har line par ek naam likho...&#10;Ali&#10;Ahmed&#10;Sara"></textarea>
<button onclick="saveNames()" style="background:#2196F3;color:#fff">Save Users</button>
<hr>
<button class="prize1" onclick="draw(1,1)">1st Prize - 5000 Rs (1 Winner)</button>
<button class="prize2" onclick="draw(2,1)">2nd Prize - 2500 Rs (1 Winner)</button>
<button class="prize3" onclick="draw(3,1)">3rd Prize - 1000 Rs (1 Winner)</button>
<button class="prize4" onclick="draw(4,10)">4th Prize - 500 Rs (10 Winners)</button>
<div id="winners"></div>
<button onclick="resetAll()" style="background:#f44336;color:#fff;margin-top:20px">Reset All Winners</button>

<script>
let users = JSON.parse(localStorage.getItem('3h_users')||'[]');
let won = JSON.parse(localStorage.getItem('3h_won')||'[]');
document.getElementById('names').value = users.join('\n');
updateCount();

function saveNames(){
  users = document.getElementById('names').value.split('\n').map(s=>s.trim()).filter(s=>s);
  localStorage.setItem('3h_users', JSON.stringify(users));
  updateCount(); alert('Saved '+users.length+' users!');
}
function updateCount(){
  document.getElementById('count').innerText = users.length;
  showWinners();
}
function draw(prize, num){
  let available = users.filter(u=>!won.includes(u));
  if(available.length < num){ alert('Itne users baki nahi! Baki: '+available.length); return; }
  let selected=[];
  for(let i=0;i<num;i++){
    let idx = Math.floor(Math.random()*available.length);
    selected.push(available[idx]);
    available.splice(idx,1);
  }
  won = won.concat(selected);
  localStorage.setItem('3h_won', JSON.stringify(won));
  showWinners();
  alert('Prize '+prize+' Winners: \n'+selected.join('\n'));
}
function showWinners(){
  document.getElementById('winners').innerHTML = '<h3>Won List (No Duplicate):</h3>' + (won.length? won.map((w,i)=> (i+1)+'. '+w).join('<br>') : 'Abhi koi winner nahi');
}
function resetAll(){
  if(confirm('Sab winners delete karne hain?')){
    won=[]; localStorage.removeItem('3h_won'); showWinners();
  }
}
</script>
</body>
</html>
