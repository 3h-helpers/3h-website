<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>3H Admin - Number Lottery</title><style>body{font-family:sans-serif;background:#111;color:#fff;padding:15px}button{width:100%;padding:14px;margin:7px 0;border:0;border-radius:10px;font-size:17px;font-weight:bold}textarea{width:100%;height:150px;border-radius:8px;padding:10px;font-size:16px}#winners{background:#222;padding:12px;border-radius:10px;margin-top:12px}</style></head><body><h2>3H Admin - Number Lottery 🎉</h2><p>Total Numbers: <b id="count">0</b></p><textarea id="names" placeholder="ہر لائن پر ایک نمبر لکھو&#10;03001234567&#10;03123456789"></textarea><button onclick="saveNames()" style="background:#2196F3;color:#fff">Save Numbers</button><hr><button style="background:#FFD700" onclick="draw(1,1)">1st Prize 5000 Rs (1)</button><button style="background:#C0C0C0" onclick="draw(2,1)">2nd Prize 2500 Rs (1)</button><button style="background:#CD7F32;color:#fff" onclick="draw(3,1)">3rd Prize 1000 Rs (1)</button><button style="background:#00c853;color:#fff" onclick="draw(4,10)">4th Prize 500 Rs (10)</button><div id="winners"></div><button onclick="resetAll()" style="background:#f44336;color:#fff">Reset</button><script>let users=JSON.parse(localStorage.getItem('3h_users')||'[]');let won=JSON.parse(localStorage.getItem('3h_won')||'[]');document.getElementById('names').value=users.join('\n');updateCount();function saveNames(){let raw=document.getElementById('names').value.split('\n').map(s=>s.trim()).filter(s=>s);let unique=[...new Set(raw)];if(raw.length!=unique.length)alert('ڈبل نمبر ہٹا دیے!');users=unique;localStorage.setItem('3h_users',JSON.stringify(users));updateCount();alert(users.length+' نمبر Save')}function updateCount(){document.getElementById('count').innerText=users.length;showWinners()}function draw(p,n){let a=users.filter(u=>!won.includes(u));if(a.length<n){alert('باقی نمبر: '+a.length);return}let s=[];for(let i=0;i<n;i++){let idx=Math.floor(Math.random()*a.length);s.push(a[idx]);a.splice(idx,1)}won=won.concat(s);localStorage.setItem('3h_won',JSON.stringify(won));showWinners();alert('Prize '+p+':\n'+s.join('\n'))}function showWinners(){document.getElementById('winners').innerHTML='<h3>Winners</h3>'+(won.length?won.map((w,i)=>(i+1)+'. '+w).join('<br>'):'کوئی ونر نہیں')}function resetAll(){if(confirm('Reset?')){won=[];localStorage.removeItem('3h_won');showWinners()}}</script></body></html>
